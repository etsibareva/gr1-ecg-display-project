version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecg_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ecg_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ecg_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - ecg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    image: ecg-test2-backend:latest 
    build: 
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: ecg_backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5104
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: ${MINIO_ROOT_USER}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD}
      MinIO__WithSSL: false
    env_file:
      - .env
    ports:
      - "5104:5104"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecg_network
    volumes:
      - ./logs:/app/logs

  frontend:
    image: ecg-test2-frontend:latest  
    build:
      context: ./FrontendApp
      dockerfile: Dockerfile
    container_name: ecg_frontend
    environment:
      - BACKEND_HOST=backend 
      - BACKEND_PORT=5104     
      - API_URL=http://backend:5104  
    ports:
      - "5004:80"  
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ecg_network

volumes:
  postgres_data:
  minio_data:

networks:
  ecg_network:
    driver: bridge