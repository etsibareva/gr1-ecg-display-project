<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="main-container">
        <button class="nav-btn switch-btn" onclick="window.location.href='ecg-viewer.html'">
            Мои разметки
        </button>

        <button class="nav-btn logout-btn" onclick="logout()">
            Выйти
        </button>

        <h1 class="page-title">Личный кабинет врача</h1>

        <div class="doctor-data-full">
            <div class="data-item">
                <label>ФИО:</label>
                <span id="doctorName">Загрузка...</span>
            </div>
            <div class="data-item">
                <label>Email:</label>
                <span id="doctorEmail">Загрузка...</span>
            </div>
            <div class="data-item">
                <label>Логин:</label>
                <span id="doctorLogin">Загрузка...</span>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            console.log('Profile page loaded');

            if (!authService.isAuthenticated()) {
                console.log('Not authenticated, redirecting to login...');
                authService.redirectToLogin();
                return;
            }

            const user = await authService.getCurrentUser();
            if (user) {
                const fullName = `${user.lastName} ${user.firstName} ${user.patronym || ''}`.trim();

                document.getElementById('doctorName').textContent = fullName;
                document.getElementById('doctorEmail').textContent = user.email;
                document.getElementById('doctorLogin').textContent = user.login;
            } else {
                console.log('Failed to load user data');
                document.getElementById('doctorName').textContent = 'Ошибка загрузки';
                document.getElementById('doctorEmail').textContent = 'Ошибка загрузки';
                document.getElementById('doctorLogin').textContent = 'Ошибка загрузки';
            }
        });

        async function logout() {
            if (confirm('Вы уверены, что хотите выйти?')) {
                await authService.logout();
            }
        }
    </script>
</body>
</html>
