<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр ЭКГ</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/tooltips.css">
</head>
<body>
    <div class="ecg-container">
        <div class="ecg-nav">
            <div class="nav-left">
                <button class="nav-btn profile-btn" onclick="window.location.href='profile.html'" style="margin-left: 10px;">
                    Личный кабинет
                </button>
                <button class="nav-btn upload-btn" onclick="document.getElementById('fileUpload').click()" style="margin-left: 10px;">
                    Загрузить ЭКГ
                </button>
                <input type="file" id="fileUpload" multiple accept=".npy" style="display: none;" onchange="handleFileUpload(this.files)">
            </div>
            <div class="nav-center">
                <h3>Просмотр ЭКГ</h3>
            </div>
            <div class="nav-right">
                <button class="nav-btn logout-btn" onclick="handleLogout()">
                    Выйти
                </button>
            </div>
        </div>

        <div class="left-column">
            <div class="graphs-row">
                <div class="graph-container graph-left" id="standard-leads">
                    <div class="graph-title">Стандартные отведения</div>
                </div>

                <div class="graph-container graph-right" id="chest-leads">
                    <div class="graph-title">Грудные отведения</div>
                </div>
            </div>

            <div class="full-signal-controls" style="margin-bottom: 10px; padding: 5px; background: #f5f5f5; border-radius: 4px;">
                <label style="font-size: 12px; margin-right: 10px;">Канал для детального просмотра:</label>
                <select id="fullSignalChannelSelect" style="padding: 4px 8px; border: 1px solid #ddd; border-radius: 3px; font-size: 12px;">
                    <option value="">-- Выберите канал --</option>
                </select>
            </div>

            <div class="graph-container graph-bottom" id="bottom-lead">
                <div class="graph-title">Дополнительные данные</div>
            </div>
        </div>

        <div class="sidebar">
            <div class="params-section">
                <div class="main-container">
                    <h4>Параметры</h4>
                    <div id="paramsData">
                        <div class="no-data">Нет записи</div>
                    </div>
                </div>
            </div>
            <div class="markups-list-section">
                <div class="main-container">
                    <div class="markups-header">
                        <h4>Разметки записи</h4>
                        <button class="refresh-btn" onclick="loadRecordMarkups(currentRecord?.recordId)">↻</button>
                    </div>
                    <div class="markups-list" id="markupsList">
                        <div class="no-data">Выберите запись</div>
                    </div>
                </div>
            </div>
            <div class="markup-section">
                <div class="main-container">
                    <h4>Новая разметка</h4>
                    <div class="wave-switchers">
                        <div class="wave-switcher-group">
                            <input type="radio" id="wave-P" name="wave-type" value="P" checked>
                            <label for="wave-P">P</label>

                            <input type="radio" id="wave-Q" name="wave-type" value="Q">
                            <label for="wave-Q">Q</label>

                            <input type="radio" id="wave-R" name="wave-type" value="R">
                            <label for="wave-R">R</label>

                            <input type="radio" id="wave-S" name="wave-type" value="S">
                            <label for="wave-S">S</label>

                            <input type="radio" id="wave-T" name="wave-type" value="T">
                            <label for="wave-T">T</label>

                            <input type="radio" id="wave-F" name="wave-type" value="F">
                            <label for="wave-F">F</label>
                        </div>
                    </div>
                    <div style="display: inline-block; margin-left: 15px;">
                        <input type="checkbox" id="markupModeToggle" style="margin-right: 5px;">
                        <label for="markupModeToggle" style="font-size: 12px; cursor: pointer;">Режим разметки</label>
                    </div>

                    <div class="markup-table-container">
    <table class="markup-table">
        <thead>
            <tr>
                <th>Тип</th>
                <th>Отведение</th>
                <th>Время 1, с</th>    
                <th>Амплитуда 1</th>
                <th>Время 2, с</th>    
                <th>Амплитуда 2</th>
                <th>Комментарий</th>
            </tr>
        </thead>
        <tbody id="markupTableBody">
            <tr>
                <td colspan="7" class="empty-markup">Нет данных разметки</td>  <!-- Было 5, стало 7 -->
            </tr>
        </tbody>
    </table>
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 10px 10px 10px 0;">
        <span id="saveMarkupStatus" style="font-size: 12px; color: #665;"></span>
        <button id="saveMarkupBtn" class="btn btn-secondary" onclick="saveAllMarkupPoints()"
                style="padding: 6px 12px; font-size: 13px; background-color: #a8e0a6; border: none; border-radius: 4px; color: black; cursor: pointer; ">
            Сохранить все
        </button>
    </div>
</div>
                </div>
            </div>
            <div class="waves-section">
                <div class="records-section">
                    <div class="main-container">
                        <div class="records-header">
                            <h4>Записи</h4>
                            <button class="refresh-btn" onclick="loadDoctorRecords()">↻</button>
                        </div>
                        <div class="records-list" id="recordsList">
                            <div class="no-data">Загрузка...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/lib/d3/d3.v7.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ecg-grid-zoom.js"></script>
    <script src="js/ecg-records.js"></script>
    <script src="js/ecg-viewer.js"></script>
</body>
</html>
